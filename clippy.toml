# Workspace-level clippy configuration

# Allow these identifiers in documentation without triggering doc_markdown lint.
# These are product/protocol/format names, not code identifiers.
doc-valid-idents = [
    "AdGuard",
    "DBpedia",
    "DINOv3",
    "EdDSA",
    "GeoJSON",
    "GeoNames",
    "IPv4",
    "JsonSchema",
    "IPv6",
    "MapLibre",
    "MediaWiki",
    "OpenAPI",
    "OpenFreeMap",
    "OpenStreetMap",
    "SQLite",
    "SpatiaLite",
    "UUIDv7",
    "WebAuthn",
    "WebGL",
    "WebP",
]

# Ban sleep functions to prevent accidental use in production code.
# Use #[allow(clippy::disallowed_methods)] at specific call sites that need it.
disallowed-methods = [
    { path = "std::thread::sleep", reason = "Use tokio::time::sleep instead, and only where truly needed" },
    { path = "tokio::time::sleep", reason = "Sleep is banned by default; add #[allow(clippy::disallowed_methods)] if truly needed", allow-invalid = true },
    { path = "tokio::time::sleep_until", reason = "Sleep is banned by default; add #[allow(clippy::disallowed_methods)] if truly needed", allow-invalid = true },
    # Direct JS evaluation against the browser is confined to the
    # `dev/tests/harness` module — every other site should interact with
    # the page via the typed WebTest methods. The harness annotates its
    # ~4 evaluate calls with #[allow(clippy::disallowed_methods, reason = ...)].
    { path = "chromiumoxide::page::Page::evaluate", reason = "Browser test JS lives only in dev/tests/harness; everywhere else use the typed WebTest methods" },
]
