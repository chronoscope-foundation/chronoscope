[serve]
address = "127.0.0.1"
port = 8080

[build]
target = "index.html"
# Write build output into the workspace `target/` directory (gitignored)
# instead of `web/dist/`, so it never lands in the working tree.
# `target/web-dist/` is dev-only — tests use $WEB_DIST from the nix shell.
dist = "../target/web-dist"

[[hooks]]
stage = "pre_build"
command = "tailwindcss"
command_arguments = ["-i", "input.css", "-o", "tailwind.css"]

# Write runtime config to dist/ after each build.
# CHRONOSCOPE_API_URL must be set (the web_dev binary sets it).
# Fails if unset — use `just web-dev` instead of bare `trunk serve`.
[[hooks]]
stage = "post_build"
command = "sh"
command_arguments = ["-c", ": ${CHRONOSCOPE_API_URL:?'not set — use just web-dev instead of bare trunk serve'} && printf '{\"api_url\":\"%s\"}' \"$CHRONOSCOPE_API_URL\" > \"${TRUNK_STAGING_DIR:?}/config.json\""]
