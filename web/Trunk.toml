[serve]
address = "127.0.0.1"
port = 8080

[build]
target = "index.html"
# Write build output into the workspace `target/` directory (gitignored)
# instead of `web/dist/`, so it never lands in the working tree.
# `target/web-dist/` is dev-only — tests use $WEB_DIST from the nix shell.
dist = "../target/web-dist"

[[hooks]]
stage = "pre_build"
command = "tailwindcss"
command_arguments = ["-i", "input.css", "-o", "tailwind.css"]

# Copy the nix-built fonts into the build output. Staged rather than copied into
# the source tree: `copy-dir` would read from `web/`, which means keeping a copy
# of the fonts in the repo that can disagree with what nix built. This way both
# the dev server and the production dist read the same store path.
#
# Fails loudly if the variable is unset, which means trunk ran outside the nix
# shell. The staging directory is fresh per build, so there is nothing stale to
# clear first.
[[hooks]]
stage = "post_build"
command = "sh"
command_arguments = [
  "-c",
  "mkdir -p \"$TRUNK_STAGING_DIR/fonts\" && cp \"$CHRONOSCOPE_WEB_FONTS\"/* \"$TRUNK_STAGING_DIR/fonts/\"",
]

# Same staging for the pinned basemap style. Both the document and the path it
# goes to come from the nix shell, so the dev server hands out the same document
# at the same path the production dist does. `set -u` keeps an unset path a
# failure instead of a file staged somewhere the map never looks.
[[hooks]]
stage = "post_build"
command = "sh"
command_arguments = [
  "-c",
  "set -u; mkdir -p \"$TRUNK_STAGING_DIR/$(dirname \"$CHRONOSCOPE_OHM_STYLE_PATH\")\" && cp \"$CHRONOSCOPE_OHM_STYLE\" \"$TRUNK_STAGING_DIR/$CHRONOSCOPE_OHM_STYLE_PATH\"",
]
