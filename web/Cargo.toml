[package]
name = "chronoscope-web"
version = "0.1.0"
edition.workspace = true

[features]
default = []
# Compile test hooks into the WASM binary. These register helper functions
# on window.__test that browser tests call via CDP evaluate. Only enabled
# for `just web-test` builds — production builds exclude them entirely.
#
# `MediaQueryList` rides along: a resize lands asynchronously, and the media
# query the stylesheet branches on is the one predicate a test can wait for. The
# app itself branches in CSS and never reads one, so the binding stays here.
test-hooks = ["web-sys/MediaQueryList"]

[lints]
workspace = true

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
leptos_router = "0.8"
console_error_panic_hook = "0.1"
# Exact pin: must match nixpkgs' wasm-bindgen-cli (flake.nix / nix/web.nix), which
# floats with the nixpkgs pin. A mismatch causes cryptic schema-version errors. Cargo
# resolves this independently of Nix, so the pin prevents `cargo update` from drifting
# past what Nix provides.
wasm-bindgen = "= 0.2.121"
web-sys = { version = "0.3", features = ["AddEventListenerOptions", "CanvasRenderingContext2d", "CssStyleDeclaration", "CustomEvent", "CustomEventInit", "Document", "DomRect", "Element", "ErrorEvent", "Event", "EventTarget", "HtmlCanvasElement", "HtmlDivElement", "HtmlElement", "HtmlImageElement", "ImageData", "KeyboardEvent", "KeyboardEventInit", "Location", "MouseEvent", "MouseEventInit", "MutationObserver", "MutationObserverInit", "Navigator", "Node", "NodeList", "PromiseRejectionEvent", "Response", "Storage", "Window"] }
send_wrapper = "0.6"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde.workspace = true
serde_json.workspace = true
chronoscope-core = { path = "../core" }
chronoscope-api-client = { path = "../api-client" }
chrono.workspace = true
futures-util.workspace = true
serde-wasm-bindgen = "0.6"
geojson = "0.24"

# The content pages are rendered by `build.rs` and their markdown parser stays
# on the host: `build/render.rs` is pulled into the build script (which does the
# rendering) and into `tests/content_render.rs` (which runs its tests), so the
# same dependency is named in both tables and never reaches the wasm bundle.
# One workspace pin, so both tables are always the same parser.
[build-dependencies]
pulldown-cmark = { workspace = true }

[dev-dependencies]
pulldown-cmark = { workspace = true }
