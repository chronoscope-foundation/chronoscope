[package]
name = "chronoscope-web"
version = "0.1.0"
edition.workspace = true

[features]
default = []
# Compile test hooks into the WASM binary. These register helper functions
# on window.__test that browser tests call via CDP evaluate. Only enabled
# for `just web-test` builds — production builds exclude them entirely.
test-hooks = []

[lints]
workspace = true

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
leptos_router = "0.8"
console_error_panic_hook = "0.1"
# Exact pin: must match wasm-bindgen-cli version in nix/rust.nix devShell.
# A mismatch causes cryptic link-time errors. Cargo resolves this independently
# of Nix, so the pin prevents `cargo update` from drifting past what Nix provides.
wasm-bindgen = "= 0.2.108"
web-sys = { version = "0.3", features = ["AddEventListenerOptions", "CanvasRenderingContext2d", "CustomEvent", "CustomEventInit", "Document", "DomRect", "Element", "ErrorEvent", "Event", "EventTarget", "HtmlCanvasElement", "HtmlDivElement", "HtmlElement", "HtmlImageElement", "ImageData", "MouseEvent", "MouseEventInit", "Navigator", "NodeList", "PromiseRejectionEvent", "Response", "Storage", "Window"] }
send_wrapper = "0.6"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde.workspace = true
serde_json.workspace = true
chronoscope-core = { path = "../core" }
chronoscope-api-client = { path = "../api-client" }
futures-util.workspace = true
serde-wasm-bindgen = "0.6"
geojson = "0.24"
