<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chronoscope</title>
    <meta name="description" content="Chronoscope connects places to their histories, tracking buildings through time alongside the photographs, maps, and records that document them. Every claim cites its source." />
    <!-- TODO: Add favicon once logo is designed -->

    <!-- Fonts, self-hosted. Built, subsetted and converted to woff2 by
         nix/web.nix, which also generates fonts.css with the per-range
         @font-face rules. Serving them same-origin keeps a third-party request
         off the critical path, keeps visitors' IPs out of Google's logs, and
         lets the browser tests measure the same layout a reader gets.

         The dev server gets these from a Trunk post_build hook and the
         production dist straight from nix; neither keeps a copy in the repo.

         Only the latin subsets are preloaded; latin-ext is fetched on demand,
         which is what the per-range split is for. The preloads matter: without
         them the first paint uses a fallback face and the page reflows when the
         real one lands (~15 px on the wordmark). -->
    <link rel="stylesheet" href="fonts/fonts.css" />
    <link rel="preload" href="fonts/source-serif-4-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/dm-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/cormorant-latin.woff2" as="font" type="font/woff2" crossorigin />

    <!-- MapLibre GL JS -->
    <script src="https://unpkg.com/maplibre-gl@5.1.0/dist/maplibre-gl.js"
      integrity="sha384-TVqWxbDHWILsUUzJNOvfZ9KwUw3sPdYRiGed9YeAkFlxMjTG8vRl2HDuYAsTh11I"
      crossorigin="anonymous"></script>
    <link
      rel="stylesheet"
      href="https://unpkg.com/maplibre-gl@5.1.0/dist/maplibre-gl.css"
      integrity="sha384-Nq6PQ+9vJPvw7U/VfDELyrWoGQMsy0gi6QShhaSrGzkpF5KkM40csg2leky+YMTd"
      crossorigin="anonymous"
    />

    <!-- Tailwind CSS (processed by Trunk) -->
    <link data-trunk rel="css" href="tailwind.css" />
  </head>
  <body class="bg-parchment text-ink font-serif">
    <link data-trunk rel="rust" data-wasm-opt="z" />
  </body>
</html>
