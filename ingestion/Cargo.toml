[package]
name = "chronoscope-ingestion"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
chronoscope-core = { path = "../core" }
chronoscope-integrations = { path = "../integrations" }
chronoscope-db = { path = "../db" }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
url.workspace = true
tracing.workspace = true

# Geospatial math (coordinate precision conversion)
geo = "0.29"

# CLI utilities
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
proptest = "1.4"

[lints]
workspace = true

[[bin]]
name = "ingest"
path = "src/bin/ingest.rs"
