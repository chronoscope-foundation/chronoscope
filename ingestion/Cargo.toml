[package]
name = "chronoscope-ingestion"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
chronoscope-core = { path = "../core" }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
url.workspace = true
oxilangtag = { version = "0.1", features = ["serde"] }

# Async compression and streaming
async-compression = { version = "0.4", features = ["tokio", "gzip", "bzip2"] }
futures = "0.3"
tokio-util = { version = "0.7", features = ["io"] }

# CLI utilities
anyhow = "1.0"

# HTTP client (async) with middleware support
reqwest = { version = "0.12", features = ["json", "stream"] }
reqwest-middleware = "0.4"
reqwest-retry = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "fs"] }

# XML parsing for SPARQL results
quick-xml = "0.38"

# MD5 hashing for Wikimedia Commons URLs
md-5 = "0.10"

# URL encoding
urlencoding = "2.1"

[dev-dependencies]
proptest = "1.4"

[lints]
workspace = true
