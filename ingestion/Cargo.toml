[package]
name = "chronoscope-ingestion"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
chronoscope-core = { path = "../core" }
chronoscope-integrations = { path = "../integrations" }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
url.workspace = true
oxilangtag = { version = "0.1", features = ["serde"] }

# Async compression and streaming
async-compression = { version = "0.4", features = ["tokio", "gzip", "bzip2"] }
futures = "0.3"
tokio-util = { version = "0.7", features = ["io"] }

# Geospatial math (coordinate precision conversion)
geo = "0.29"

# CLI utilities
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "fs"] }

[dev-dependencies]
proptest = "1.4"

[lints]
workspace = true

[[bin]]
name = "ingest"
path = "src/bin/ingest.rs"
