[package]
name = "region-builder"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "region-builder"
path = "src/main.rs"

[dependencies]
anyhow = "1"
# Our ZoneType enum for mapping cosmogony zone types to DB strings.
chronoscope-api-client = { path = "../../api-client" }
# cosmogony repo has two crates: `cosmogony` (types: Zone, ZoneType) and
# `cosmogony_builder` (processing: build_cosmogony). We need both.
cosmogony = { git = "https://github.com/osm-without-borders/cosmogony", tag = "v0.14.6" }
cosmogony_builder = { git = "https://github.com/osm-without-borders/cosmogony", tag = "v0.14.6" }
geojson = { version = "0.24", features = ["geo-types"] }
geo-types = "0.7"
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
