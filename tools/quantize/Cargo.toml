[package]
name = "chronoscope-quantize"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "qwen-quantize"
path = "src/main.rs"

[dependencies]
# The write pass runs on CPU whatever the features, so metal is not needed to
# produce the UQFF. It rides on the darwin target only to build against the same
# mistral.rs configuration the runtime loads with, sidestepping any question of
# whether the AFQ4 write path compiles without it.
mistralrs = { workspace = true }
tokio = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
mistralrs = { workspace = true, features = ["metal"] }
