[package]
name = "chronoscope-dev"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "web-dev"
path = "src/bin/web_dev.rs"

[lints]
workspace = true

[features]
default = []
# Enable to record VCR fixtures instead of reading from cache
record-fixtures = []

[dependencies]
# API crate (provides AppState, Config, JwtConfig, register_api)
# Enable embedded-media for dev to serve media at /media/{key}
chronoscope-api = { path = "../api", features = ["embedded-media"] }

# Analysis crate (for TritonClient in analysis worker)
chronoscope-analysis = { path = "../analysis" }

# DB crate (for Database, InMemoryMediaStore, user management)
chronoscope-db = { path = "../db" }

# Workers crate (for URL fetcher worker, IntegrationName)
chronoscope-workers = { path = "../workers" }

# Web framework (for Dropshot server configuration)
dropshot = "0.16"

# Tracing (for worker logging)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTTP client (for ngrok API)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Serialization (for ngrok API responses)
serde.workspace = true

# Async runtime
tokio.workspace = true

# Utilities
url.workspace = true
uuid.workspace = true
thiserror.workspace = true

# Temp files (for copying read-only Nix store DBs)
tempfile = "3"

# Logging
slog = "2"

[dev-dependencies]
# API client (typed Client/AuthClient for integration tests)
chronoscope-api-client = { path = "../api-client" }

# Testing
tokio-test = "0.4"
test-with = "0.14"
bytes = "1"
chrono.workspace = true
serde_json.workspace = true
# Image validation
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
# For bundle loading e2e tests
chronoscope-core = { path = "../core" }
chronoscope-ingestion = { path = "../ingestion" }
oxilangtag = { version = "0.1", features = ["serde"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
url.workspace = true
