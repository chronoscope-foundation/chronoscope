[package]
name = "chronoscope-dev"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "web-dev"
path = "src/bin/web_dev.rs"

# Browser tests are gated so the workspace-wide `cargo test` doesn't pull
# them in. They each launch a Chrome and starve cores when scheduled
# alongside every other test binary. Enabled by `just test web` and the
# dedicated `web-test` flake check.
[[test]]
name = "web"
path = "tests/web.rs"
required-features = ["browser-tests"]

[lints]
workspace = true

[features]
default = []
# Enable to record VCR fixtures instead of reading from cache
record-fixtures = []
browser-tests = []

[dependencies]
# API crate (provides AppState, Config, JwtConfig, register_api)
# Enable embedded-media for dev to serve media at /media/{key}
chronoscope-api = { path = "../api", features = ["embedded-media"] }

# Analysis crate (for TritonClient in analysis worker)
chronoscope-analysis = { path = "../analysis" }

# DB crate (for Database, InMemoryMediaStore, user management)
chronoscope-db = { path = "../db" }

# Workers crate (for URL fetcher worker, IntegrationName)
chronoscope-workers = { path = "../workers" }

# Web framework (for Dropshot server configuration)
dropshot = "0.16"

# Tracing (for worker logging)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTTP client (for ngrok API)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Serialization (for ngrok API responses)
serde.workspace = true

# Async runtime
tokio.workspace = true

# Utilities
url.workspace = true
uuid.workspace = true
thiserror.workspace = true

# Temp files (for copying read-only Nix store DBs)
tempfile = "3"

# Logging
slog = "2"

# Used by seed_test_media to generate placeholder images + hash + DB inserts
bytes = "1"
chrono.workspace = true
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }

# Fact-store types (for the curated-JSONL loader in `factstore`)
chronoscope-core = { path = "../core" }
chronoscope-ingestion = { path = "../ingestion" }
chronoscope-integrations = { path = "../integrations" }
serde_json.workspace = true

[dev-dependencies]
# API client (typed Client/AuthClient for integration tests)
chronoscope-api-client = { path = "../api-client" }

# Test builds want `Database::worker_progress`. Cargo unions this with the
# regular dep above so the feature only applies to test targets.
chronoscope-db = { path = "../db", features = ["test-support"] }

# Testing
tokio-test = "0.4"
test-with = "0.14"
oxilangtag = { version = "0.1", features = ["serde"] }
url.workspace = true

# Browser testing (headless Chrome via CDP)
chromiumoxide = "0.9"
futures = "0.3"
# Static file serving for built web frontend
axum = "0.8"
tower-http = { version = "0.6", features = ["fs"] }
