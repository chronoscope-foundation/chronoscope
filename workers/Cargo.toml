[package]
name = "chronoscope-workers"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[features]
## Record HTTP fixtures for VCR-style tests (hits real network).
## Usage: cargo test -p chronoscope-workers --features record-fixtures
record-fixtures = []

[dependencies]
# Internal crates
chronoscope-db = { path = "../db" }

# Async runtime
tokio.workspace = true

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "stream"] }
async-trait = "0.1"
bytes.workspace = true
futures-util = "0.3"

# Hashing (for HTTP cache keys)
sha2 = "0.10"
hex = "0.4"

# Utilities
chrono.workspace = true
thiserror.workspace = true
uuid.workspace = true
url.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
tracing = "0.1"

# Content extraction and processing
readability-js = "0.1"
html2md = "0.2"
scraper = "0.22"
infer = "0.19"

# Image processing
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
kamadak-exif = "0.6"
image_hasher = "3.0"

# Video metadata
mp4parse = "0.17"
# matroska removed: requires file path, not in-memory buffer; WebM parsing not yet implemented

[dev-dependencies]
tempfile = "3"
