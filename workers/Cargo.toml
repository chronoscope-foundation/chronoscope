[package]
name = "chronoscope-workers"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[features]
## Record HTTP fixtures for VCR-style tests (hits real network).
## Usage: cargo test -p chronoscope-workers --features record-fixtures
record-fixtures = []

[dependencies]
# Internal crates
chronoscope-db = { path = "../db" }

# Async runtime
tokio.workspace = true

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip"] }
async-trait = "0.1"
bytes.workspace = true

# Hashing (for HTTP cache keys)
sha2 = "0.10"
hex = "0.4"

# Utilities
chrono.workspace = true
thiserror.workspace = true
uuid.workspace = true
url.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
