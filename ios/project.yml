# Nix splices store paths into the at-sign placeholders below
# (see nix/openapi.nix). Generate the project with `just xcodegen`.
name: Chronoscope
options:
  bundleIdPrefix: chronoscope.app
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

packages:
  ChronoscopeAPI:
    path: "@ios_api_package@"

configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"

targets:
  Chronoscope:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      - path: ShareExtension/ShareView.swift  # Included for SwiftUI preview support
    resources:
      - path: Shared/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: chronoscope.app
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_ENTITLEMENTS: App/Chronoscope.entitlements
      configs:
        Debug:
          ASSOCIATED_DOMAIN_MODE: "?mode=developer"
        Release:
          ASSOCIATED_DOMAIN_MODE: ""
    dependencies:
      - target: ChronoscopeShareExtension
        embed: true
      - package: ChronoscopeAPI
        product: ChronoscopeAPI
    preBuildScripts:
      - name: SwiftFormat
        script: |
          FMT="@swiftformat@/bin/swiftformat"
          if [ ! -x "$FMT" ]; then
            echo "error: swiftformat not found at $FMT; run 'just xcodegen' to regenerate the project" >&2
            exit 1
          fi
          "$FMT" "$SRCROOT"
        basedOnDependencyAnalysis: false
    postCompileScripts:
      - name: SwiftLint
        script: |
          LINT="@swiftlint@/bin/swiftlint"
          if [ ! -x "$LINT" ]; then
            echo "error: swiftlint not found at $LINT; run 'just xcodegen' to regenerate the project" >&2
            exit 1
          fi
          cd "$SRCROOT" && "$LINT" lint --quiet
        basedOnDependencyAnalysis: false

  ChronoscopeShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: chronoscope.app.share
        INFOPLIST_FILE: ShareExtension/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_ENTITLEMENTS: ShareExtension/ShareExtension.entitlements
    dependencies:
      - package: ChronoscopeAPI
        product: ChronoscopeAPI

  ChronoscopeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: chronoscope.app.tests
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: Chronoscope

  ChronoscopeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: chronoscope.app.uitests
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: Chronoscope

schemes:
  Chronoscope:
    build:
      targets:
        Chronoscope: all
        ChronoscopeShareExtension: all
        ChronoscopeTests: [test]
        ChronoscopeUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ChronoscopeTests
        - ChronoscopeUITests
    archive:
      config: Release
