name: Chronoscope
options:
  bundleIdPrefix: chronoscope.app
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

packages:
  ChronoscopeAPI:
    path: ChronoscopeAPI

configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"

targets:
  Chronoscope:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      - path: ShareExtension/ShareView.swift  # Included for SwiftUI preview support
    resources:
      - path: Shared/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: chronoscope.app
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_ENTITLEMENTS: App/Chronoscope.entitlements
      configs:
        Debug:
          ASSOCIATED_DOMAIN_MODE: "?mode=developer"
        Release:
          ASSOCIATED_DOMAIN_MODE: ""
    dependencies:
      - target: ChronoscopeShareExtension
        embed: true
      - package: ChronoscopeAPI
        product: ChronoscopeAPI
    preBuildScripts:
      - name: SwiftFormat
        script: |
          export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
          if command -v swiftformat >/dev/null; then
            swiftformat "$SRCROOT"
          else
            echo "warning: SwiftFormat not installed, run 'brew install swiftformat'"
          fi
        basedOnDependencyAnalysis: false
    postCompileScripts:
      - name: SwiftLint
        script: |
          export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
          if command -v swiftlint >/dev/null; then
            cd "$SRCROOT" && swiftlint lint --quiet
          else
            echo "warning: SwiftLint not installed, run 'brew install swiftlint'"
          fi
        basedOnDependencyAnalysis: false

  ChronoscopeShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: chronoscope.app.share
        INFOPLIST_FILE: ShareExtension/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_ENTITLEMENTS: ShareExtension/ShareExtension.entitlements
    dependencies:
      - package: ChronoscopeAPI
        product: ChronoscopeAPI

  ChronoscopeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: chronoscope.app.tests
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: Chronoscope

  ChronoscopeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: chronoscope.app.uitests
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: Chronoscope

schemes:
  Chronoscope:
    build:
      targets:
        Chronoscope: all
        ChronoscopeShareExtension: all
        ChronoscopeTests: [test]
        ChronoscopeUITests: [test]
      preActions:
        - script: |
            export PATH="$HOME/.cargo/bin:$PATH"
            OPENAPI_JSON="${SRCROOT}/../api/target/openapi.json"
            API_SRC="${SRCROOT}/../api/src"
            DB_SRC="${SRCROOT}/../db/src"
            if [ ! -f "$OPENAPI_JSON" ] || \
               [ -n "$(find "$API_SRC" -newer "$OPENAPI_JSON" 2>/dev/null)" ] || \
               [ -n "$(find "$DB_SRC" -newer "$OPENAPI_JSON" 2>/dev/null)" ]; then
              echo "Regenerating OpenAPI spec..."
              cd "${SRCROOT}/../api" && cargo run --bin openapi -- target/openapi.json
            fi
          name: Generate OpenAPI Spec
          settingsTarget: Chronoscope
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ChronoscopeTests
        - ChronoscopeUITests
    archive:
      config: Release
