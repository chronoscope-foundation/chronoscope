[package]
name = "chronoscope-db"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# What other crates' integration tests reach into this one for: in-process
# worker-progress notifications, and the ephemeral Postgres+PostGIS cluster
# harness (which also needs `postgres`, the feature gating the module it sits
# in). The notifications are NOT for production: a `watch::Sender` only reaches
# same-process subscribers, so multi-instance deployments would need a
# cross-host signal (LISTEN/NOTIFY, a bus, etc.). The gate prevents prod code
# from depending on any of it.
test-support = ["dep:tempfile"]

# Postgres fact-store backend. Off by default — the SQLite backend is the only
# one wired into `Database`, and enabling this pulls sqlx's postgres driver in.
postgres = ["sqlx/postgres"]

[dependencies]
# Internal crates
chronoscope-api-client = { path = "../api-client", features = ["sqlx"] }
chronoscope-core = { path = "../core", features = ["sqlx"] }
chronoscope-integrations = { path = "../integrations" }

# Database - sqlx with SQLite for now, same API works for Postgres later
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "derive", "chrono", "json"] }

# Serialization
serde.workspace = true
serde_json.workspace = true

# Schema generation for OpenAPI
schemars.workspace = true

# Async runtime
tokio.workspace = true

# Utilities
base64.workspace = true
uuid.workspace = true
url.workspace = true
chrono.workspace = true
strum.workspace = true
thiserror.workspace = true

# Async traits and bytes (for MediaStore)
async-trait = "0.1"
bytes.workspace = true

# The Postgres harness's cluster directories. Optional because the harness is
# the only non-test code that touches it.
tempfile = { version = "3", optional = true }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
proptest = "1.4"
# The backend-agnostic FactStore conformance suite.
chronoscope-core = { path = "../core", features = ["sqlx", "test-support"] }
