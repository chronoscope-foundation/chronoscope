[package]
name = "chronoscope-db"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# In-process worker-progress notifications for integration tests. NOT for
# production: a `watch::Sender` only reaches same-process subscribers, so
# multi-instance deployments would need a cross-host signal
# (LISTEN/NOTIFY, a bus, etc.). The gate prevents prod code from
# depending on it.
test-support = []

[dependencies]
# Internal crates
chronoscope-api-client = { path = "../api-client", features = ["sqlx"] }
chronoscope-core = { path = "../core", features = ["sqlx"] }
chronoscope-integrations = { path = "../integrations" }

# Database - sqlx with SQLite for now, same API works for Postgres later
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "derive", "chrono", "json"] }

# Serialization
serde.workspace = true
serde_json.workspace = true

# Schema generation for OpenAPI
schemars.workspace = true

# Async runtime
tokio.workspace = true

# Utilities
base64.workspace = true
uuid.workspace = true
url.workspace = true
chrono.workspace = true
strum.workspace = true
thiserror.workspace = true

# Async traits and bytes (for MediaStore)
async-trait = "0.1"
bytes.workspace = true

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
proptest = "1.4"
# The backend-agnostic FactStore conformance suite.
chronoscope-core = { path = "../core", features = ["sqlx", "test-support"] }
