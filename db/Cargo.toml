[package]
name = "chronoscope-db"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Database - sqlx with SQLite for now, same API works for Postgres later
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "derive", "chrono"] }

# Serialization
serde.workspace = true
serde_json.workspace = true

# Schema generation for OpenAPI
schemars.workspace = true

# Async runtime
tokio.workspace = true

# Utilities
base64.workspace = true
uuid.workspace = true
url.workspace = true
chrono.workspace = true
thiserror.workspace = true

# Async traits and bytes (for MediaStore)
async-trait = "0.1"
bytes.workspace = true

[dev-dependencies]
tokio-test = "0.4"
