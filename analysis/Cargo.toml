[package]
name = "chronoscope-analysis"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "corpus-fetch"
path = "src/bin/corpus_fetch.rs"
required-features = ["corpus"]

# The pipeline entry over a batch of images. Not feature-gated: this crate is in
# `default-members`, so a gated model-path binary would compile nowhere in the
# commit gate and rot the way `corpus-test` did.
[[bin]]
name = "analyze"
path = "src/bin/analyze.rs"

[features]
default = []
## Corpus image pipeline: manifest parsing and rate-limited downloads for the
## `corpus-fetch` FOD binary. Not built by default, since the downloader is
## only ever invoked from Nix.
corpus = [
    "dep:chronoscope-integrations",
    "dep:url",
    "dep:tempfile",
]
## The helpers a test loads a model with (the backend choice, the CoreML cache
## root, a cause-chain printer). In-crate tests see them through `cfg(test)`;
## this is how the integration tests reach the same ones, the way `core` and
## `db` expose their own test support.
test-support = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

# The ask's schema render parses the schema JSON `Value` into a typed model once
# (`ask::render`); `IndexMap` deserializes the `properties`/`definitions` objects
# preserving the order the schema wrote them in, so the rendered prompt matches
# the order the grammar enforces.
indexmap = { version = "2", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# ONNX Runtime, linked at build time against the library nix puts at
# ORT_LIB_LOCATION. Anything that compiles this crate needs the runtime to run
# it, so resolving the library later buys nothing and costs a handle that must
# be present in every environment the binaries and tests run in. Exact pin
# because the release-candidate series changes API between candidates.
#
# `api-23` selects the ONNX Runtime C API version to request. The crate's default
# is `api-27`, and the runtime refuses to load a library that advertises an older
# API than asked, so this pins a conservative floor the `analysis` shell's
# onnxruntime serves (a newer library answers an older request via GetApi).
#
# `coreml` enables the CoreML execution-provider builder that `onnx::Backend`
# selects. Neither is feature-gated: this crate is in `default-members`, so a
# gated model path would compile nowhere in the commit gate and rot the way
# `corpus-test` did.
ort = { version = "=2.0.0-rc.13", default-features = false, features = [
    "std",
    "tracing",
    "api-23",
    "coreml",
] }

# The resize the checkpoint's processor leaves to the caller. Its convolution
# path is float-native and antialiases by scaling kernel support with the
# reduction factor, which is what torchvision does; the `image` crate's
# resampler is neither.
fast_image_resize = "6.1"

# `embed` takes a decoded `DynamicImage` and converts it with `to_rgb8`, so this
# crate sits on the public boundary. jpeg/png decode the corpus in the reference
# test; the other default decoders are dead weight here.
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
] }

# SAM 3's concept/text prompt tokenizes with the standard CLIP BPE. The
# `facebook/sam3` `tokenizer.json` (pinned in the export's closure) loads through
# this crate byte-identically to sam3's own `SimpleTokenizer`; the runner only
# owes the pad-to-32-with-0 the graph's `(tokens != 0)` mask reads. Already in the
# closure via mistral.rs, so a direct dependency is free.
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }

# Set-of-Mark draws each region as a filled/hollow circle marker over the
# subimage; imageproc 0.25 tracks the `image` 0.25 pin.
imageproc = "0.25"

# The glyph rasterizer imageproc's text drawing renders the marker numbers with.
ab_glyph = "0.2"

# SAM 3 masks are `core`'s `Region`, and box prompts are its `ProportionalRect`,
# so the analysis pipeline speaks the grammar's geometry directly.
chronoscope-core = { path = "../core" }

chronoscope-integrations = { path = "../integrations", optional = true }
url = { workspace = true, optional = true }
tempfile = { version = "3", optional = true }

# The async runtime. The `analyze` binary drives the async `open`/`ask` on it,
# and the reference test does the same; the lib's own async fns are driven by the
# caller's runtime. Already in the closure via mistral.rs, so a direct default
# dependency is free, and the binary must build in the default gate.
tokio = { workspace = true }

# Qwen 3.6's VLM runtime. CPU base on every platform; the darwin target below
# adds the Metal GPU backend. Its Metal kernels compile at runtime
# (MISTRALRS_METAL_PRECOMPILE=0 in the build) rather than through xcrun, so the
# build needs no Xcode.
mistralrs = { workspace = true }

# `qwen3::ask` derives the sampling constraint from the caller's type via
# schemars and hands it to mistral.rs as a raw JSON-schema `Value`, so nothing
# forces mistralrs's own schemars 1: the workspace 0.8 produces a schema
# llguidance compiles just as well, and it lets the ask reuse core's grammar
# types (`ImageMedium`, `Text`) instead of mirroring them.
schemars.workspace = true

[dev-dependencies]
# The mask-comparison proptests: IoU's laws and its dense-mask oracle, which
# sample grids and mask content rather than naming cases.
proptest = "1.4"

# The crate depends on itself so its own integration tests get `test-support`.
# A dev-dependency's features apply when cargo builds the test targets, and
# nothing else turns the feature on, so the helpers stay out of a normal build.
chronoscope-analysis = { path = ".", features = ["test-support"] }

[target.'cfg(target_os = "macos")'.dependencies]
# The Metal GPU backend, on Apple hardware only; other platforms run on CPU.
mistralrs = { workspace = true, features = ["metal"] }
