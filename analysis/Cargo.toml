[package]
name = "chronoscope-analysis"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "analyze"
path = "src/bin/analyze.rs"

[dependencies]
# Serialization
serde.workspace = true
serde_json.workspace = true

# Schema generation for OpenAPI
schemars.workspace = true

# Async runtime
tokio.workspace = true

# HTTP client abstraction from integrations crate
chronoscope-integrations = { path = "../integrations" }

# URL handling
url.workspace = true

# Error handling
thiserror.workspace = true

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# Base64 for image encoding
base64.workspace = true

# Byte handling
bytes.workspace = true

# Async trait for mock implementations
async-trait.workspace = true

# HTTP types needed for mock responses in tests (reqwest types exposed via integrations)
reqwest = { version = "0.12", default-features = false }

[dev-dependencies]
# Enable testing utilities (MockHttpClient) for unit tests
chronoscope-integrations = { path = "../integrations", features = ["testing"] }
