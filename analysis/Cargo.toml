[package]
name = "chronoscope-analysis"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "analyze"
path = "src/bin/analyze.rs"

[[bin]]
name = "corpus"
path = "src/bin/corpus.rs"
required-features = ["corpus-test"]

[features]
default = []
testing = []
## Corpus regression test suite (requires live Triton server + internet).
## Never part of `just check` or normal CI.
corpus-test = ["dep:toml", "dep:chrono", "dep:futures"]

[dependencies]
# Serialization
serde.workspace = true
serde_json.workspace = true

# Schema generation for OpenAPI
schemars.workspace = true

# Async runtime
tokio.workspace = true

# Error handling
thiserror.workspace = true

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# Base64 for image encoding
base64.workspace = true

# Async trait for trait definitions
async-trait.workspace = true

# gRPC client
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"

# Hashing for fixture cache keys
sha2 = "0.10"
hex = "0.4"

# Corpus test suite (optional, gated behind corpus-test feature)
toml = { version = "0.8", optional = true }
chrono = { workspace = true, optional = true }
futures = { version = "0.3", optional = true }

[build-dependencies]
tonic-prost-build = "0.14"
protobuf-src = "2"

[dev-dependencies]
tempfile = "3"
