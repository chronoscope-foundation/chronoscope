[workspace]
resolver = "2"
members = ["api", "db", "dev", "workers"]

[workspace.package]
edition = "2024"
authors = ["Chronoscope Contributors"]
license = "MIT"
repository = "https://github.com/copumpkin/chronoscope"

# Workspace-wide lint configuration
# All crates inherit these via `[lints] workspace = true`
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Schema generation for OpenAPI
schemars = { version = "0.8", features = ["chrono"] }

# Common utilities
chrono = { version = "0.4", features = ["serde"] }
url = { version = "2.5", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v5", "v7", "serde"] }
base64 = "0.22"
thiserror = "2"
bytes = "1"
