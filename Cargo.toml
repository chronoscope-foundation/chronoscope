[workspace]
resolver = "2"
members = ["analysis", "api", "api-client", "core", "db", "dev", "ingestion", "integrations", "macros", "tools/quantize", "web", "workers"]
default-members = ["analysis", "api", "api-client", "core", "db", "dev", "ingestion", "integrations", "macros", "tools/quantize", "workers"]

[workspace.package]
edition = "2024"
authors = ["Chronoscope Contributors"]
license = "MIT"
repository = "https://github.com/copumpkin/chronoscope"

# Workspace-wide lint configuration
# All crates inherit these via `[lints] workspace = true`
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
unused_self = "warn"
doc_markdown = "deny"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
async-lock = "3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_with = { version = "3", default-features = false, features = ["macros"] }

# Schema generation for OpenAPI
schemars = { version = "0.8", features = ["chrono", "url"] }

# Common utilities
chrono = { version = "0.4", features = ["serde"] }
url = { version = "2.5", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v5", "v7", "serde", "js"] }
base64 = "0.22"
thiserror = "2"
bytes = "1"
oxilangtag = { version = "0.1", features = ["serde"] }
unicode-normalization = "0.1"
strum = { version = "0.27", features = ["derive"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
sha2 = "0.10"
hex = "0.4"
serde_jcs = "0.2"
parking_lot = { version = "0.12", features = ["send_guard"] }

# Build-time markdown rendering for the web content pages. chronoscope-web
# names it in two tables, build and dev, for the build script that renders and
# the test target that exercises the same code. Those resolve independently, so
# one pin here is what keeps the tests on the parser the build actually runs.
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }

# Structured logging
tracing = "0.1"

# Proc-macro authoring (chronoscope-macros)
syn = "2"
quote = "1"
proc-macro2 = "1"

# VLM runtime, used only by the analysis crate. CPU base here; the analysis
# crate adds the metal feature on darwin. Pinned to the rev the crane build is
# proven against.
mistralrs = { git = "https://github.com/EricLBuehler/mistral.rs", rev = "8010b6a0578e416120b590ed72fd46ed5f24ee85", default-features = false }

# WASM size optimizations — applied to all release builds but the savings
# primarily matter for the wasm32 target. LTO and codegen-units=1 let LLVM
# eliminate dead code across crate boundaries; opt-level "z" and strip
# minimise the final binary.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
